name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ml.txt
        pip install pytest "httpx<0.28.0"
        
    - name: Run Tests
      env:
        TMDB_API_KEY: "dummy_key_for_tests"
      run: |
        cd backend
        pytest tests/

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install
      run: uv sync --frozen

    - name: Lint
      run: uv run ruff check .

    - name: Model and serving tests (synthetic data, no download)
      run: uv run pytest
